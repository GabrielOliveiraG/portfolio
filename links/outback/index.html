	    _czmb.loadImage = function(path, id, father, prefix, extension, callback) {
	        if (_czmbLegacy.isObject(path)) {
	            if (path.hasOwnProperty("path")) path = path.path;
	            if (path.hasOwnProperty("id")) id = path.id;
	            if (path.hasOwnProperty("father")) father = path.father;
	            if (path.hasOwnProperty("prefix")) prefix = path.prefix;
	            if (path.hasOwnProperty("extension")) extension = path.extension;
	            if (path.hasOwnProperty("callback")) callback = path.callback;
	        }
	        if ((typeof id === "undefined") || (typeof father === "undefined")) {
	            return false;
	        }
	        path = path || "";
	        if (_czmbLegacy.isArray(id)) {
	            prefix = prefix || "";
	            extension = extension || "png";
	            if (path.substr(path.length - 1) != "/") {
	                path += "/";
	            }
	            var counter = 0;
	            _czmbLegacy.forEach(id, function(val) {
	                _czmb.load_img(path + prefix + val + "." + extension, prefix + val, father, function() {
	                    counter++;
	                    if ((counter == id.length) && (typeof callback === 'function')) {
	                        callback();
	                    }
	                });
	            });
	        } else {
	            _czmb.load_img(path, id, father, callback);
	        }
	    };
